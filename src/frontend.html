<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model API Tester v0.1.4</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50:'#eef2ff',100:'#e0e7ff',500:'#4f46e5',600:'#4338ca',700:'#3730a3' }
          }
        }
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.7/viewer.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.7/viewer.min.js"></script>
  <style>
    /* scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
    /* markdown */
    .md-content p { margin: 0.4em 0; }
    .md-content p:first-child { margin-top: 0; }
    .md-content p:last-child { margin-bottom: 0; }
    .md-content pre { background: #1e1e2e; color: #cdd6f4; padding: 10px; border-radius: 6px; overflow-x: auto; margin: 6px 0; font-size: 13px; }
    .md-content code { background: rgba(0,0,0,0.08); padding: 1px 4px; border-radius: 3px; font-size: 13px; }
    .dark .md-content code { background: rgba(255,255,255,0.1); }
    .md-content pre code { background: none; padding: 0; }
    .md-content table { border-collapse: collapse; width: 100%; margin: 6px 0; }
    .md-content th, .md-content td { border: 1px solid #e5e7eb; padding: 6px 10px; font-size: 13px; }
    .dark .md-content th, .dark .md-content td { border-color: #374151; }
    .md-content th { background: #f9fafb; }
    .dark .md-content th { background: #1f2937; }
    .md-content ul, .md-content ol { margin: 0.4em 0; padding-left: 1.5em; }
    /* 上下文开关 */
    .toggle-bg { transition: background 0.2s; }
    .toggle-dot { transition: transform 0.2s; }
    input:checked + .toggle-bg { background: #4f46e5; }
    input:checked + .toggle-bg .toggle-dot { transform: translateX(18px); }
    /* spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.8s linear infinite; }
    /* 抽屉折叠过渡 */
    .drawer-pane { transition: width 0.2s ease, border-width 0.2s, padding 0.2s, margin 0.2s; overflow: hidden; }
    .drawer-pane.collapsed { width: 0 !important; border-left-width: 0; border-right-width: 0; padding-left: 0; padding-right: 0; }
  </style>
  <script>
  // ============================================================
  // i18n 字典
  // ============================================================
  const I18N = {
    zh: {
      app_title: 'Model API Tester',
      access_verify: '访问验证',
      enter_password: '输入访问密码',
      enter: '进入',
      wrong_password: '密码错误',
      conversation_list: '对话列表',
      new_conversation: '新建',
      new_conversation_title: '新对话',
      waiting_response: '等待响应...',
      input_placeholder: '输入消息，Enter 发送，Shift+Enter 换行',
      upload_file: '上传图片或文件',
      send: '发送',
      support_hint: '支持图片（多模态）与文件上传 · 响应耗时自动统计',
      context: '上下文',
      context_hint: '开启后发送历史上下文',
      clear: '清空',
      clear_confirm: '清空当前对话的所有消息？',
      delete: '删除',
      delete_confirm: '确定删除此对话？',
      base_url: 'Base URL',
      api_key: 'API Key',
      model: '模型',
      api_type: 'API 类型',
      other_mainstream: '其他主流',
      endpoint: '路径',
      auto: 'auto（自动）',
      system_prompt: '系统提示词',
      optional: '（可选）',
      save_config: '保存模型配置',
      advanced: '高级选项',
      saved_configs: '已保存的模型配置',
      no_saved_configs: '暂无保存的配置',
      new_conv_default: '新对话',
      request_failed: '请求失败',
      please_fill: '请填写 Base URL、API Key 和模型',
      please_fill_first: '请先填写 Base URL、API Key 和模型',
      please_select_conv: '请先创建或选择一个对话',
      config_name: '配置名称：',
      unnamed: '未命名',
      saved: '已保存',
      loaded: '已加载',
      delete_config_confirm: '删除此模型配置？',
      fetch_models_first: '请先填写 Base URL',
      no_models: '接口未返回模型列表',
      fetch_models_failed: '拉取模型列表失败',
      attachment: '附件',
      github_repo: 'GitHub 仓库',
      lang_switch: 'English',
      theme_light: '亮色',
      theme_dark: '暗色',
      switch_theme: '切换主题',
      switch_lang: '切换语言',
      file_attachment: '文件附件',
    },
    en: {
      app_title: 'Model API Tester',
      access_verify: 'Access Verification',
      enter_password: 'Enter access password',
      enter: 'Enter',
      wrong_password: 'Wrong password',
      conversation_list: 'Conversations',
      new_conversation: 'New',
      new_conversation_title: 'New Chat',
      waiting_response: 'Waiting for response...',
      input_placeholder: 'Type a message, Enter to send, Shift+Enter for newline',
      upload_file: 'Upload image or file',
      send: 'Send',
      support_hint: 'Supports image (multimodal) and file upload · Auto response timing',
      context: 'Context',
      context_hint: 'Send conversation history when enabled',
      clear: 'Clear',
      clear_confirm: 'Clear all messages in this conversation?',
      delete: 'Delete',
      delete_confirm: 'Delete this conversation?',
      base_url: 'Base URL',
      api_key: 'API Key',
      model: 'Model',
      api_type: 'API Type',
      other_mainstream: 'Other',
      endpoint: 'Endpoint',
      auto: 'auto',
      system_prompt: 'System Prompt',
      optional: '(optional)',
      save_config: 'Save Config',
      advanced: 'Advanced',
      saved_configs: 'Saved Configurations',
      no_saved_configs: 'No saved configurations',
      new_conv_default: 'New Chat',
      request_failed: 'Request failed',
      please_fill: 'Please fill in Base URL, API Key and model',
      please_fill_first: 'Please fill in Base URL, API Key and model first',
      please_select_conv: 'Please create or select a conversation first',
      config_name: 'Config name:',
      unnamed: 'Unnamed',
      saved: 'Saved',
      loaded: 'Loaded',
      delete_config_confirm: 'Delete this configuration?',
      fetch_models_first: 'Please fill in Base URL first',
      no_models: 'No models returned from API',
      fetch_models_failed: 'Failed to fetch model list',
      attachment: 'Attachment',
      github_repo: 'GitHub Repository',
      lang_switch: '中文',
      theme_light: 'Light',
      theme_dark: 'Dark',
      switch_theme: 'Toggle theme',
      switch_lang: 'Switch language',
      file_attachment: 'File attachment',
    }
  };

  let currentLang = localStorage.getItem('lang') || (navigator.language?.startsWith('zh') ? 'zh' : 'en');
  if (!I18N[currentLang]) currentLang = 'en';

  function t(key) {
    return (I18N[currentLang] && I18N[currentLang][key]) || I18N.en[key] || key;
  }

  // ============================================================
  // 主题
  // ============================================================
  let currentTheme = localStorage.getItem('theme') || 'light';
  function applyTheme(theme) {
    currentTheme = theme;
    localStorage.setItem('theme', theme);
    if (theme === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
    const icon = document.getElementById('themeIcon');
    if (icon) {
      icon.className = theme === 'dark' ? 'fas fa-sun w-5 text-center' : 'fas fa-moon w-5 text-center';
    }
  }

  function toggleTheme() {
    applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
  }

  function toggleLang() {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    localStorage.setItem('lang', currentLang);
    document.documentElement.lang = currentLang === 'zh' ? 'zh' : 'en';
    applyI18n();
  }

  // 将所有带 data-i18n 属性的元素更新为对应翻译
  function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph')));
    });
    document.querySelectorAll('[data-i18n-title]').forEach(el => {
      el.setAttribute('title', t(el.getAttribute('data-i18n-title')));
    });
    // 更新语言切换按钮文字
    const langBtn = document.getElementById('langBtn');
    if (langBtn) langBtn.textContent = t('lang_switch');
    // 更新 select option 的 data-i18n
    document.querySelectorAll('option[data-i18n]').forEach(el => {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    // 更新 spinner 文字
    const sp = document.getElementById('spinnerText');
    if (sp && !sp.dataset.manual) sp.textContent = t('waiting_response');
    // 更新输入框 placeholder
    const inp = document.getElementById('input');
    if (inp) inp.setAttribute('placeholder', t('input_placeholder'));
  }
  </script>
</head>
<body class="h-screen flex flex-col bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-200">

  <!-- 认证遮罩 -->
  <div id="authOverlay" class="fixed inset-0 bg-black/60 z-[9999] flex items-center justify-center hidden">
    <div class="bg-white dark:bg-gray-800 rounded-xl p-8 text-center shadow-2xl">
      <h2 class="text-lg font-semibold mb-4 text-gray-700 dark:text-gray-200"><i class="fas fa-lock mr-1"></i><span data-i18n="access_verify">访问验证</span></h2>
      <input type="password" id="authInput" data-i18n-ph="enter_password" placeholder="输入访问密码" class="w-56 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 rounded-lg text-sm mb-3" onkeydown="if(event.key==='Enter')doAuth()">
      <button onclick="doAuth()" class="w-56 py-2 bg-brand-500 text-white rounded-lg text-sm font-semibold hover:bg-brand-600"><span data-i18n="enter">进入</span></button>
      <div id="authError" class="text-red-600 text-sm mt-2 min-h-[18px]"></div>
    </div>
  </div>

  <!-- 顶部栏 -->
  <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 h-12 flex items-center gap-3 shrink-0">
    <!-- 左抽屉切换 -->
    <button onclick="toggleLeftDrawer()" id="leftDrawerToggle" class="p-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg text-gray-500 dark:text-gray-400" data-i18n-title="conversation_list" title="会话列表">
      <i class="fas fa-list w-5 text-center"></i>
    </button>
    <h1 class="text-sm font-semibold text-gray-700 dark:text-gray-200 flex items-center gap-1.5">
      <i class="fas fa-robot text-brand-500"></i> Model API Tester
      <span class="text-[10px] font-medium text-gray-400 bg-gray-100 dark:bg-gray-700 rounded px-1.5 py-0.5">v0.1.3</span>
    </h1>
    <span id="currentConvTitle" class="text-xs text-gray-400 ml-2 truncate"></span>
    <!-- 语言切换 -->
    <button onclick="toggleLang()" id="langBtn" class="ml-auto p-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg text-gray-500 dark:text-gray-400 transition text-xs font-medium" data-i18n-title="switch_lang" title="切换语言">
      <i class="fas fa-language w-5 text-center"></i>
    </button>
    <!-- 主题切换 -->
    <button onclick="toggleTheme()" class="p-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg text-gray-500 dark:text-gray-400 transition" data-i18n-title="switch_theme" title="切换主题">
      <i class="fas fa-moon w-5 text-center" id="themeIcon"></i>
    </button>
    <!-- GitHub 链接 -->
    <a href="https://github.com/yachen4ever/ModelApiTester" target="_blank" rel="noopener" class="p-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg text-gray-500 dark:text-gray-400 transition" data-i18n-title="github_repo" title="GitHub 仓库">
      <i class="fab fa-github w-5 text-center text-base"></i>
    </a>
    <!-- 右抽屉切换 -->
    <button onclick="toggleRightDrawer()" id="rightDrawerToggle" class="p-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg text-gray-500 dark:text-gray-400" title="模型配置">
      <i class="fas fa-cog w-5 text-center"></i>
    </button>
  </header>

  <!-- 主体 -->
  <div class="flex flex-1 overflow-hidden">

    <!-- 左抽屉：对话列表 -->
    <div id="leftDrawer" class="drawer-pane w-64 shrink-0 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col">
      <div class="px-3 py-2 border-b border-gray-100 dark:border-gray-700 flex items-center justify-between shrink-0">
        <span class="text-xs font-semibold text-gray-500 dark:text-gray-400" data-i18n="conversation_list">对话列表</span>
        <button onclick="newConversation()" class="text-xs text-brand-500 hover:text-brand-600 font-medium">
          <i class="fas fa-plus mr-0.5"></i><span data-i18n="new_conversation">新建</span>
        </button>
      </div>
      <div id="conversationList" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
    </div>

    <!-- 聊天区 -->
    <main class="flex-1 flex flex-col overflow-hidden">
      <!-- 消息列表 -->
      <div id="chatHistory" class="flex-1 overflow-y-auto px-6 py-4 space-y-3"></div>

      <!-- spinner -->
      <div id="spinner" class="hidden self-start px-6">
        <div class="inline-flex items-center gap-2 px-3 py-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl rounded-bl-sm">
          <i class="fas fa-spinner spin text-gray-400 text-sm"></i>
          <span id="spinnerText" class="text-sm text-gray-400">等待响应...</span>
        </div>
      </div>

      <!-- 输入区 -->
      <div class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 px-4 py-2.5 shrink-0">
        <div id="attachmentPreviewArea" class="flex gap-2 flex-wrap mb-2 empty:hidden"></div>
        <div class="flex gap-2 items-center">
          <textarea id="input" rows="1" data-i18n-ph="input_placeholder" placeholder="输入消息，Enter 发送，Shift+Enter 换行"
            class="flex-1 px-3 py-2.5 text-sm border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 rounded-lg resize-none outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 min-h-[42px] max-h-120"
            onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
          <button onclick="document.getElementById('fileInput').click()" class="w-10 h-10 shrink-0 border border-gray-300 dark:border-gray-600 rounded-lg flex items-center justify-center text-gray-400 hover:border-brand-500 hover:text-brand-500 transition" data-i18n-title="upload_file" title="上传图片或文件">
            <i class="fas fa-paperclip"></i>
          </button>
          <button id="sendBtn" onclick="sendMessage()" class="w-10 h-10 shrink-0 bg-brand-500 text-white rounded-lg flex items-center justify-center hover:bg-brand-600 transition" data-i18n-title="send" title="发送">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
        <input type="file" id="fileInput" multiple class="hidden" onchange="handleFileSelect(event)">
        <div class="flex items-center justify-between mt-1.5 text-[11px] text-gray-400">
          <span class="whitespace-nowrap overflow-hidden text-ellipsis pr-3" data-i18n="support_hint">支持图片（多模态）与文件上传 · 响应耗时自动统计</span>
          <div class="flex items-center gap-4 shrink-0 pl-3 border-l border-gray-200 dark:border-gray-700">
            <label class="flex items-center gap-1.5 cursor-pointer select-none" data-i18n-title="context_hint" title="开启后发送历史上下文">
              <span data-i18n="context">上下文</span>
              <span class="relative inline-block w-9 h-5">
                <input type="checkbox" id="contextToggle" class="sr-only peer">
                <span class="toggle-bg peer-checked:bg-brand-500 block w-9 h-5 bg-gray-300 rounded-full relative">
                  <span class="toggle-dot absolute left-0.5 top-0.5 w-4 h-4 bg-white rounded-full"></span>
                </span>
              </span>
            </label>
            <button onclick="clearCurrentChat()" class="flex items-center gap-1 px-1.5 py-0.5 text-gray-400 hover:bg-red-50 dark:hover:bg-red-900/20 hover:text-red-600 rounded transition" data-i18n-title="clear" title="清空当前对话">
              <i class="fas fa-trash-alt"></i> <span data-i18n="clear">清空</span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- 右抽屉：模型配置（默认展开） -->
    <div id="rightDrawer" class="drawer-pane w-72 shrink-0 bg-white dark:bg-gray-800 border-l border-gray-200 dark:border-gray-700 overflow-y-auto p-4 space-y-3">
      <!-- 模型配置表单 -->
      <div class="space-y-2.5">
        <div>
          <label class="text-xs font-semibold text-gray-600 dark:text-gray-400 block mb-1">Base URL</label>
          <input type="text" id="url" placeholder="https://api.openai.com/v1" class="w-full px-2.5 py-1.5 text-sm border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 rounded-md focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600 dark:text-gray-400 block mb-1">API Key</label>
          <input type="text" id="key" placeholder="sk-..." class="w-full px-2.5 py-1.5 text-sm border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 rounded-md focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600 dark:text-gray-400 block mb-1" data-i18n="model">模型</label>
          <div class="relative">
            <input type="text" id="model" placeholder="gpt-4o" autocomplete="off"
              class="w-full px-2.5 py-1.5 pr-8 text-sm border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 rounded-md focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none"
              onfocus="showModelSuggestionsOnFocus()" oninput="filterModelSuggestions(this.value)">
            <button onclick="fetchModels()" data-i18n-title="fetch_models" title="从接口拉取模型列表" class="absolute right-1.5 top-1/2 -translate-y-1/2 w-6 h-6 flex items-center justify-center text-gray-400 hover:text-brand-500 transition">
              <i class="fas fa-sync-alt text-xs" id="modelRefreshIcon"></i>
            </button>
            <div id="modelSuggest" class="hidden absolute z-20 mt-1 w-full bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-md shadow-lg max-h-48 overflow-y-auto"></div>
          </div>
        </div>
        <div class="flex gap-2">
          <div class="w-1/3">
            <label class="text-xs font-semibold text-gray-600 dark:text-gray-400 block mb-1" data-i18n="api_type">API 类型</label>
            <select id="apiType" onchange="onApiTypeChange()" class="w-full px-2 py-1.5 text-sm border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 rounded-md outline-none focus:border-brand-500 bg-white">
              <option value="openai">openai</option>
              <option value="anthropic">anthropic</option>
              <option value="google">google</option>
              <option value="other" data-i18n="other_mainstream">其他主流</option>
            </select>
          </div>
          <div class="flex-1">
            <label class="text-xs font-semibold text-gray-600 dark:text-gray-400 block mb-1" data-i18n="endpoint">路径</label>
            <select id="endpoint" onchange="onEndpointChange()" class="w-full px-2 py-1.5 text-sm border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 rounded-md outline-none focus:border-brand-500 bg-white">
              <option value="" data-i18n="auto">auto（自动）</option>
            </select>
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600 dark:text-gray-400 block mb-1"><span data-i18n="system_prompt">系统提示词</span> <span class="text-gray-400 font-normal" data-i18n="optional">（可选）</span></label>
          <textarea id="systemPrompt" rows="2" placeholder="You are a helpful assistant." class="w-full px-2.5 py-1.5 text-sm border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 rounded-md focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none resize-none"></textarea>
        </div>
      </div>

      <!-- 保存配置按钮 -->
      <button onclick="saveCurrentConfig()" class="w-full px-3 py-2 bg-brand-500 text-white rounded-md text-xs font-semibold hover:bg-brand-600 flex items-center justify-center gap-1.5">
        <i class="fas fa-save"></i> <span data-i18n="save_config">保存模型配置</span>
      </button>
      <div id="savedModelHint" class="text-[10px] text-gray-400 text-center hidden"></div>

      <!-- 高级选项 -->
      <div>
        <button onclick="toggleAdvanced(event)" id="advBtn" class="w-full flex items-center justify-between px-3 py-2 text-xs font-semibold text-gray-600 dark:text-gray-400 bg-gray-50 dark:bg-gray-700/50 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-md border border-gray-200 dark:border-gray-600">
          <span><i class="fas fa-sliders-h mr-1"></i> <span data-i18n="advanced">高级选项</span></span>
          <i class="fas fa-chevron-down text-gray-400 transition-transform duration-200" id="advChevron"></i>
        </button>
        <div id="advPanel" class="hidden mt-2 p-3 bg-gray-50 dark:bg-gray-700/50 rounded-md border border-gray-200 dark:border-gray-600 space-y-2.5">
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="text-xs text-gray-600 dark:text-gray-400 block mb-0.5">Temperature</label>
              <input type="number" id="temperature" value="1" min="0" max="2" step="0.1" class="w-full px-2 py-1 text-xs border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 rounded-md outline-none focus:border-brand-500">
            </div>
            <div>
              <label class="text-xs text-gray-600 dark:text-gray-400 block mb-0.5">Max Tokens</label>
              <input type="number" id="max_tokens" value="4096" min="1" class="w-full px-2 py-1 text-xs border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 rounded-md outline-none focus:border-brand-500">
            </div>
            <div>
              <label class="text-xs text-gray-600 dark:text-gray-400 block mb-0.5">Top P</label>
              <input type="number" id="top_p" value="1" min="0" max="1" step="0.1" class="w-full px-2 py-1 text-xs border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 rounded-md outline-none focus:border-brand-500">
            </div>
            <div>
              <label class="text-xs text-gray-600 dark:text-gray-400 block mb-0.5">Freq Penalty</label>
              <input type="number" id="frequency_penalty" value="0" min="-2" max="2" step="0.1" class="w-full px-2 py-1 text-xs border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 rounded-md outline-none focus:border-brand-500">
            </div>
          </div>
        </div>
      </div>

      <!-- 已保存的模型配置列表 -->
      <div>
        <div class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1.5" data-i18n="saved_configs">已保存的模型配置</div>
        <div id="savedConfigs" class="space-y-1"></div>
      </div>
    </div>
  </div>

<script>
// ============================================================
// 全局状态
// ============================================================
let accessToken = sessionStorage.getItem('accessToken') || '';
let currentConvId = null;
let selectedAttachments = [];
const converter = new showdown.Converter({ tables: true, strikethrough: true, simpleLineBreaks: true });

// ============================================================
// API 客户端
// ============================================================
async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...options.headers };
  if (accessToken) headers['X-Auth-Password'] = accessToken;
  const res = await fetch(path, { ...options, headers });
  if (res.status === 401) {
    showAuth();
    throw new Error('Unauthorized');
  }
  return res.json();
}

// ============================================================
// 认证
// ============================================================
function showAuth() {
  document.getElementById('authOverlay').classList.remove('hidden');
}

function doAuth() {
  const val = document.getElementById('authInput').value;
  accessToken = val;
  sessionStorage.setItem('accessToken', val);
  api('api/health').then(() => {
    document.getElementById('authOverlay').classList.add('hidden');
    document.getElementById('authError').textContent = '';
    init();
  }).catch(() => {
    document.getElementById('authError').textContent = t('wrong_password');
    accessToken = '';
    sessionStorage.removeItem('accessToken');
  });
}

// ============================================================
// 初始化
// ============================================================
async function init() {
  try {
    await api('api/health');
    document.getElementById('authOverlay').classList.add('hidden');
    await loadConversations();
    await loadSavedConfigs();
    if (!currentConvId) {
      await newConversation();
    }
  } catch(e) {
    showAuth();
  }
}

// ============================================================
// 会话管理
// ============================================================
async function loadConversations() {
  const convs = await api('api/conversations');
  const list = document.getElementById('conversationList');
  list.innerHTML = '';
  if (convs.length === 0) return;

  convs.forEach(c => {
    const isActive = c.id === currentConvId;
    const div = document.createElement('div');
    div.className = `group flex items-center gap-2 px-2.5 py-2 rounded-lg cursor-pointer text-sm ${isActive ? 'bg-brand-50 dark:bg-brand-500/10 text-brand-700 dark:text-brand-300' : 'hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300'}`;
    div.onclick = () => loadConversation(c.id);
    div.innerHTML = `
      <i class="fas fa-comment text-xs ${isActive ? 'text-brand-500' : 'text-gray-300 dark:text-gray-600'}"></i>
      <span class="flex-1 truncate">${escapeHtml(c.title)}</span>
      <span class="text-[10px] text-gray-400">${c.message_count || 0}</span>
      <button onclick="event.stopPropagation();deleteConversation(${c.id})" class="opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-600 transition" title="${t('delete')}">
        <i class="fas fa-times text-xs"></i>
      </button>
    `;
    list.appendChild(div);
  });
}

async function newConversation() {
  const conv = await api('api/conversations', {
    method: 'POST',
    body: JSON.stringify({ title: t('new_conversation_title'), context_enabled: 1 })
  });
  currentConvId = conv.id;
  document.getElementById('chatHistory').innerHTML = '';
  document.getElementById('contextToggle').checked = false;
  document.getElementById('currentConvTitle').textContent = conv.title;
  await loadConversations();
}

async function loadConversation(id) {
  currentConvId = id;
  const conv = await api(`api/conversations`);
  const found = conv.find(c => c.id === id);
  if (found) {
    document.getElementById('currentConvTitle').textContent = found.title;
    document.getElementById('contextToggle').checked = !!found.context_enabled;
    // 恢复上次使用的模型配置
    if (found.last_config) {
      try {
        const cfg = JSON.parse(found.last_config);
        applyConfig(cfg);
      } catch(e) {}
    }
  }
  const messages = await api(`api/conversations/${id}/messages`);
  const container = document.getElementById('chatHistory');
  container.innerHTML = '';
  messages.forEach(m => renderMessage(m));
  scrollToBottom();
  await loadConversations();
}

async function deleteConversation(id) {
  if (!confirm(t('delete_confirm'))) return;
  await api(`api/conversations/${id}`, { method: 'DELETE' });
  if (currentConvId === id) {
    currentConvId = null;
    document.getElementById('chatHistory').innerHTML = '';
    document.getElementById('currentConvTitle').textContent = '';
  }
  await loadConversations();
  const convs = await api('api/conversations');
  if (convs.length > 0) {
    await loadConversation(convs[0].id);
  } else {
    await newConversation();
  }
}

async function clearCurrentChat() {
  if (!currentConvId) return;
  if (!confirm(t('clear_confirm'))) return;
  await api(`api/conversations/${currentConvId}/messages`, { method: 'DELETE' });
  document.getElementById('chatHistory').innerHTML = '';
}

// ============================================================
// 模型配置管理
// ============================================================
async function loadSavedConfigs() {
  const configs = await api('api/configs');
  const container = document.getElementById('savedConfigs');
  container.innerHTML = '';
  if (configs.length === 0) {
    container.innerHTML = `<div class="text-xs text-gray-400 italic">${t('no_saved_configs')}</div>`;
    return;
  }
  configs.forEach(c => {
    const div = document.createElement('div');
    div.className = 'group flex items-center gap-2 px-2.5 py-1.5 rounded-md hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer text-xs border border-gray-100 dark:border-gray-600';
    div.onclick = () => applyConfig(c);
    div.innerHTML = `
      <i class="fas fa-server text-gray-400 text-[10px]"></i>
      <div class="flex-1 min-w-0">
        <div class="font-medium text-gray-700 dark:text-gray-300 truncate">${escapeHtml(c.name)}</div>
        <div class="text-[10px] text-gray-400 truncate">${escapeHtml(c.model)}</div>
      </div>
      <button onclick="event.stopPropagation();deleteConfig(${c.id})" class="opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-600 transition shrink-0" title="${t('delete')}">
        <i class="fas fa-trash-alt text-[10px]"></i></button>
    `;
    container.appendChild(div);
  });
}

function applyConfig(c) {
  document.getElementById('url').value = c.base_url || '';
  document.getElementById('key').value = c.api_key || '';
  document.getElementById('model').value = c.model || '';
  const apiType = c.api_type || detectApiType(c.base_url, c.model, c.endpoint);
  document.getElementById('apiType').value = apiType;
  updateEndpointOptions();
  const ep = (c.endpoint === 'auto' || !c.endpoint) ? '' : c.endpoint;
  const epSel = document.getElementById('endpoint');
  if (![...epSel.options].some(o => o.value === ep)) {
    const opt = document.createElement('option');
    opt.value = ep; opt.textContent = ep;
    epSel.appendChild(opt);
  }
  epSel.value = ep;
  document.getElementById('systemPrompt').value = c.system_prompt || '';
  document.getElementById('temperature').value = c.temperature ?? 1;
  document.getElementById('max_tokens').value = c.max_tokens ?? 4096;
  document.getElementById('top_p').value = c.top_p ?? 1;
  document.getElementById('frequency_penalty').value = c.frequency_penalty ?? 0;
  const hint = document.getElementById('savedModelHint');
  hint.textContent = `${t('loaded')}: ${c.name} (${c.model})`;
  hint.classList.remove('hidden');
}

function detectApiType(baseUrl, model, endpoint) {
  const u = (baseUrl || '').toLowerCase();
  const m = (model || '').toLowerCase();
  const ep = (endpoint || '').toLowerCase();
  if (u.includes('anthropic') || m.includes('claude') || ep.includes('/v1/messages')) return 'anthropic';
  if (u.includes('googleapis') || u.includes('generativelanguage') || m.includes('gemini')) return 'google';
  return 'openai';
}

const ENDPOINT_PRESETS = {
  openai:    ['', '/v1/chat/completions', '/v1/responses', '/v1/completions', '/v1/embeddings', '/v1/models'],
  anthropic: ['', '/v1/messages', '/v1/complete', '/v1/models'],
  google:    ['', '/v1beta/models/{model}:generateContent', '/v1beta/models/{model}:streamGenerateContent', '/v1/models'],
  other:     ['', '/v1/chat/completions', '/v1/messages'],
};

function updateEndpointOptions() {
  const type = document.getElementById('apiType').value;
  const sel = document.getElementById('endpoint');
  const prev = sel.value;
  sel.innerHTML = '';
  ENDPOINT_PRESETS[type].forEach(ep => {
    const opt = document.createElement('option');
    opt.value = ep;
    opt.textContent = ep ? ep : t('auto');
    sel.appendChild(opt);
  });
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
}

function onApiTypeChange() {
  updateEndpointOptions();
}

function onEndpointChange() {
}

// ============================================================
// 模型列表拉取与筛选
// ============================================================
async function fetchModels() {
  const baseUrl = document.getElementById('url').value.trim();
  const apiKey = document.getElementById('key').value.trim();
  const apiType = document.getElementById('apiType').value;
  const icon = document.getElementById('modelRefreshIcon');
  icon.classList.add('spin');
  try {
    if (!baseUrl) { alert(t('fetch_models_first')); return; }
    let url = baseUrl.replace(/\/+$/, '');
    let headers = { 'Content-Type': 'application/json' };
    if (apiType === 'anthropic') {
      headers['x-api-key'] = apiKey;
      headers['anthropic-version'] = '2023-06-01';
      if (url.endsWith('/v1')) url = url.replace(/\/v1$/, '');
      url += '/v1/models';
    } else if (apiType === 'google') {
      if (url.endsWith('/v1beta')) url = url;
      else if (url.endsWith('/v1')) url = url.replace(/\/v1$/, '/v1beta');
      url += '/v1beta/models';
    } else {
      headers['Authorization'] = `Bearer ${apiKey}`;
      if (url.endsWith('/v1')) url += '/models';
      else url += '/v1/models';
    }
    const res = await fetch(url, { headers });
    if (!res.ok) {
      const err = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status}: ${err.slice(0, 120)}`);
    }
    const data = await res.json();
    let models = [];
    if (Array.isArray(data)) models = data;
    else if (data.data && Array.isArray(data.data)) models = data.data;
    else if (data.models && Array.isArray(data.models)) models = data.models;
    else if (data.list && Array.isArray(data.list)) models = data.list;
    models = models.map(m => typeof m === 'string' ? m : (m.id || m.name || '')).filter(Boolean);
    if (models.length === 0) { alert(t('no_models')); return; }
    showModelSuggestions(models);
  } catch (e) {
    alert(`${t('fetch_models_failed')}: ${e.message}`);
  } finally {
    icon.classList.remove('spin');
  }
}

let modelListCache = [];

function showModelSuggestions(models) {
  const box = document.getElementById('modelSuggest');
  if (models && Array.isArray(models)) modelListCache = models;
  if (modelListCache.length === 0) return;
  const input = document.getElementById('model').value.trim().toLowerCase();
  const filtered = modelListCache.filter(m => !input || m.toLowerCase().includes(input)).slice(0, 50);
  if (filtered.length === 0) { box.classList.add('hidden'); return; }
  box.innerHTML = '';
  filtered.forEach(m => {
    const div = document.createElement('div');
    div.className = 'px-2.5 py-1.5 text-sm text-gray-700 dark:text-gray-300 hover:bg-brand-50 dark:hover:bg-brand-500/20 hover:text-brand-700 dark:hover:text-brand-300 cursor-pointer truncate';
    div.textContent = m;
    div.onmousedown = (e) => { e.preventDefault(); document.getElementById('model').value = m; box.classList.add('hidden'); };
    box.appendChild(div);
  });
  box.classList.remove('hidden');
}

function filterModelSuggestions(value) {
  if (modelListCache.length === 0) return;
  showModelSuggestions(modelListCache);
}

async function showModelSuggestionsOnFocus() {
  if (modelListCache.length > 0) { showModelSuggestions(modelListCache); return; }
  await fetchModels();
}

async function saveCurrentConfig() {
  const data = getFormData();
  if (!data.base_url || !data.api_key || !data.model) {
    alert(t('please_fill_first'));
    return;
  }
  const name = prompt(t('config_name'), `${data.model} @ ${tryGetHost(data.base_url)}`);
  if (name === null) return;
  await api('api/configs', {
    method: 'POST',
    body: JSON.stringify({ ...data, name: name || t('unnamed') })
  });
  await loadSavedConfigs();
  const hint = document.getElementById('savedModelHint');
  hint.textContent = `${t('saved')}: ${name || t('unnamed')} → ${data.model} @ ${tryGetHost(data.base_url)}`;
  hint.classList.remove('hidden');
}

async function deleteConfig(id) {
  if (!confirm(t('delete_config_confirm'))) return;
  await api(`api/configs/${id}`, { method: 'DELETE' });
  await loadSavedConfigs();
}

// ============================================================
// 消息渲染
// ============================================================
function renderMessage(m) {
  const container = document.getElementById('chatHistory');
  const isUser = m.role === 'user';
  const isError = m.is_error;
  const wrapper = document.createElement('div');
  wrapper.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'}`;

  const bubble = document.createElement('div');
  bubble.className = `max-w-[75%] rounded-2xl px-3.5 py-2.5 text-sm leading-relaxed ${
    isUser ? 'bg-brand-500 text-white rounded-br-md' :
    isError ? 'bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-800 rounded-bl-md' :
    'bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 border border-gray-200 dark:border-gray-700 rounded-bl-md'
  }`;

  let content = m.content;
  try { content = JSON.parse(m.content); } catch(e) { }

  if (typeof content === 'string') {
    if (isUser) {
      bubble.textContent = content;
    } else {
      bubble.innerHTML = `<div class="md-content">${converter.makeHtml(content)}</div>`;
    }
  } else if (Array.isArray(content)) {
    content.forEach(part => {
      if (part.type === 'text') {
        if (isUser) {
          const span = document.createElement('span');
          span.textContent = part.text;
          bubble.appendChild(span);
        } else {
          bubble.innerHTML += `<div class="md-content">${converter.makeHtml(part.text)}</div>`;
        }
      } else if (part.type === 'image_url') {
        const img = document.createElement('img');
        img.className = 'max-w-[200px] max-h-48 rounded-lg mt-1 cursor-zoom-in';
        img.src = part.image_url.url;
        img.dataset.src = part.image_url.url;
        bubble.appendChild(img);
      } else if (part.type === 'file') {
        const fileDiv = document.createElement('div');
        fileDiv.className = 'flex items-center gap-2 px-2.5 py-1.5 rounded-md bg-black/5 dark:bg-white/10 mt-1 text-xs';
        fileDiv.innerHTML = `<i class="fas fa-file text-gray-400"></i><span class="truncate">${escapeHtml(part.name || t('attachment'))}</span><span class="text-gray-400 shrink-0">${formatSize(part.size || 0)}</span>`;
        bubble.appendChild(fileDiv);
      }
    });
  }

  // 附加存储的图片（仅当 content 不是数组或不包含 image_url 时才渲染，避免重复）
  const contentHasImages = Array.isArray(content) && content.some(p => p.type === 'image_url');
  if (!contentHasImages && m.images && m.images.length > 0) {
    m.images.forEach(dataUrl => {
      const img = document.createElement('img');
      img.className = 'max-w-[200px] max-h-48 rounded-lg mt-1 cursor-zoom-in';
      img.dataset.src = dataUrl;
      img.src = dataUrl;
      bubble.appendChild(img);
    });
  }

  wrapper.appendChild(bubble);

  if (m.duration_ms || m.tokens || m.model_name) {
    const meta = document.createElement('div');
    meta.className = `flex gap-3 text-[11px] text-gray-400 mt-1 ${isUser ? 'justify-end' : 'justify-start'}`;
    let metaHtml = '';
    if (m.duration_ms) metaHtml += `<span><i class="fas fa-clock mr-0.5"></i>${formatDuration(m.duration_ms)}</span>`;
    if (m.tokens) metaHtml += `<span><i class="fas fa-coins mr-0.5"></i>${m.tokens} tokens</span>`;
    if (m.model_name) metaHtml += `<span><i class="fas fa-microchip mr-0.5"></i>${escapeHtml(m.model_name)}</span>`;
    meta.innerHTML = metaHtml;
    wrapper.appendChild(meta);
  }

  container.appendChild(wrapper);
}

function scrollToBottom() {
  const c = document.getElementById('chatHistory');
  c.scrollTop = c.scrollHeight;
}

// ============================================================
// 附件处理
// ============================================================
function handleFileSelect(event) {
  const files = event.target.files;
  for (const file of files) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const isImage = file.type.startsWith('image/');
      selectedAttachments.push({
        type: isImage ? 'image' : 'file',
        name: file.name,
        size: file.size,
        dataUrl: e.target.result
      });
      renderAttachmentPreviews();
    };
    reader.readAsDataURL(file);
  }
  event.target.value = '';
}

function renderAttachmentPreviews() {
  const area = document.getElementById('attachmentPreviewArea');
  area.innerHTML = '';
  selectedAttachments.forEach((att, idx) => {
    const thumb = document.createElement('div');
    if (att.type === 'image') {
      thumb.className = 'relative w-16 h-16 rounded-md overflow-hidden border border-gray-200 dark:border-gray-600';
      thumb.innerHTML = `<img src="${att.dataUrl}" class="w-full h-full object-cover"><button onclick="removeAttachment(${idx})" class="absolute top-0.5 right-0.5 w-4 h-4 bg-black/50 text-white rounded-full flex items-center justify-center text-[8px]"><i class="fas fa-times"></i></button>`;
    } else {
      thumb.className = 'relative flex items-center gap-2 max-w-[200px] px-2.5 py-1.5 rounded-md border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700';
      thumb.innerHTML = `
        <i class="fas fa-file text-gray-400 text-sm"></i>
        <span class="text-[11px] text-gray-600 dark:text-gray-300 truncate">${escapeHtml(att.name)}</span>
        <span class="text-[10px] text-gray-400 shrink-0">${formatSize(att.size)}</span>
        <button onclick="removeAttachment(${idx})" class="w-4 h-4 bg-black/50 text-white rounded-full flex items-center justify-center text-[8px] shrink-0"><i class="fas fa-times"></i></button>`;
    }
    area.appendChild(thumb);
  });
}

function removeAttachment(idx) {
  selectedAttachments.splice(idx, 1);
  renderAttachmentPreviews();
}

function formatSize(bytes) {
  if (bytes < 1024) return `${bytes}B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)}KB`;
  return `${(bytes / 1024 / 1024).toFixed(1)}MB`;
}

// ============================================================
// 发送消息
// ============================================================
function getFormData() {
  return {
    base_url: document.getElementById('url').value.trim(),
    api_key: document.getElementById('key').value.trim(),
    model: document.getElementById('model').value.trim(),
    endpoint: document.getElementById('endpoint').value.trim() || '',
    api_type: document.getElementById('apiType').value,
    system_prompt: document.getElementById('systemPrompt').value.trim(),
    temperature: parseFloat(document.getElementById('temperature').value) || 1,
    max_tokens: parseInt(document.getElementById('max_tokens').value) || 4096,
    top_p: parseFloat(document.getElementById('top_p').value) || 1,
    frequency_penalty: parseFloat(document.getElementById('frequency_penalty').value) || 0,
  };
}

function getApiUrl(baseUrl, endpoint, model, apiType) {
  let cleanUrl = baseUrl.trim().replace(/\/+$/, '');
  if (!endpoint || endpoint === 'auto') {
    const type = (apiType || detectApiType(baseUrl, model, '')).toLowerCase();
    let path;
    if (type === 'anthropic') path = 'v1/messages';
    else if (type === 'google') path = 'v1beta/models/{model}:generateContent';
    else path = 'v1/chat/completions';
    if (cleanUrl.endsWith('/v1')) return `${cleanUrl}/${path.substring(3)}`;
    if (cleanUrl.endsWith('/v1beta') && path.startsWith('v1beta')) return `${cleanUrl}/${path.substring(6)}`;
    return `${cleanUrl}/${path}`;
  }
  if (endpoint.includes('{model}')) {
    endpoint = endpoint.replace('{model}', encodeURIComponent(model));
  }
  if (endpoint.startsWith('/v1/') && cleanUrl.endsWith('/v1')) return cleanUrl + endpoint.substring(3);
  if (endpoint.startsWith('/v1beta/') && cleanUrl.endsWith('/v1beta')) return cleanUrl + endpoint.substring(7);
  return `${cleanUrl}${endpoint.startsWith('/') ? '' : '/'}${endpoint}`;
}

function isClaudeModel(model) { return model.toLowerCase().includes('claude'); }

async function sendMessage() {
  const inputText = document.getElementById('input').value.trim();
  if (!inputText && selectedAttachments.length === 0) return;

  const data = getFormData();
  if (!data.base_url || !data.api_key || !data.model) {
    alert(t('please_fill'));
    return;
  }
  if (!currentConvId) {
    alert(t('please_select_conv'));
    return;
  }

  const useContext = document.getElementById('contextToggle').checked;

  const images = selectedAttachments.filter(a => a.type === 'image').map(a => a.dataUrl);
  const files = selectedAttachments.filter(a => a.type === 'file');
  let displayContent;
  if (selectedAttachments.length > 0) {
    displayContent = [];
    if (inputText) displayContent.push({ type: 'text', text: inputText });
    images.forEach(url => displayContent.push({ type: 'image_url', image_url: { url } }));
    files.forEach(f => displayContent.push({ type: 'file', name: f.name, size: f.size, data: f.dataUrl }));
  } else {
    displayContent = inputText;
  }

  await api('api/messages', {
    method: 'POST',
    body: JSON.stringify({
      conversation_id: currentConvId,
      role: 'user',
      content: displayContent,
      images: images
    })
  });

  const userMsg = { role: 'user', content: displayContent, images: images };
  renderMessage(userMsg);
  scrollToBottom();

  document.getElementById('input').value = '';
  autoResize(document.getElementById('input'));
  selectedAttachments = [];
  renderAttachmentPreviews();

  document.getElementById('spinner').classList.remove('hidden');
  const sp = document.getElementById('spinnerText');
  sp.textContent = t('waiting_response');
  sp.dataset.manual = '1';
  document.getElementById('sendBtn').disabled = true;

  const startTime = performance.now();

  try {
    let messages = [];
    if (useContext) {
      const history = await api(`api/conversations/${currentConvId}/messages`);
      history.forEach(m => {
        if (m.role === 'system') return;
        let c = m.content;
        try { c = JSON.parse(m.content); } catch(e) {}
        let text = '';
        if (typeof c === 'string') text = c;
        else if (Array.isArray(c)) text = c.filter(p => p.type === 'text').map(p => p.text).join('');
        if (text) messages.push({ role: m.role, content: text });
      });
    } else {
      let text = '';
      if (typeof displayContent === 'string') text = displayContent;
      else if (Array.isArray(displayContent)) text = displayContent.filter(p => p.type === 'text').map(p => p.text).join('');
      messages.push({ role: 'user', content: text });
    }

    if (data.system_prompt) {
      messages.unshift({ role: 'system', content: data.system_prompt });
    }

    if (Array.isArray(displayContent) && displayContent.some(p => p.type === 'image_url' || p.type === 'file')) {
      for (let i = messages.length - 1; i >= 0; i--) {
        if (messages[i].role === 'user') {
          messages[i].content = displayContent;
          break;
        }
      }
    }

    const apiUrl = getApiUrl(data.base_url, data.endpoint, data.model, data.api_type);
    const claude = (data.api_type === 'anthropic') || isClaudeModel(data.model);
    const google = (data.api_type === 'google') || data.model.toLowerCase().includes('gemini');

    let requestBody;
    let systemText = '';
    let isMessagesEndpoint = false;

    if (claude) {
      isMessagesEndpoint = true;
      const sysIdx = messages.findIndex(m => m.role === 'system');
      if (sysIdx !== -1) {
        systemText = messages[sysIdx].content;
        messages = messages.filter(m => m.role !== 'system');
      }
      requestBody = {
        model: data.model,
        max_tokens: data.max_tokens,
        messages: messages.map(m => {
          if (typeof m.content !== 'string') {
            return {
              role: m.role,
              content: m.content.map(p => {
                if (p.type === 'text') return { type: 'text', text: p.text };
                if (p.type === 'image_url') {
                  const match = p.image_url.url.match(/^data:(image\/(\w+));base64,(.+)$/);
                  if (match) return { type: 'image', source: { type: 'base64', media_type: match[1], data: match[3] } };
                }
                if (p.type === 'file') {
                  const match = p.data.match(/^data:([^;]+);base64,(.+)$/);
                  if (match) return { type: 'document', source: { type: 'base64', media_type: match[1], data: match[2] } };
                }
                return null;
              }).filter(Boolean)
            };
          }
          return m;
        })
      };
      if (systemText) requestBody.system = systemText;
    } else if (google) {
      const sysIdx = messages.findIndex(m => m.role === 'system');
      if (sysIdx !== -1) {
        systemText = messages[sysIdx].content;
        messages = messages.filter(m => m.role !== 'system');
      }
      const partsFor = (m) => {
        if (typeof m.content !== 'string' && Array.isArray(m.content)) {
          const parts = [];
          m.content.forEach(p => {
            if (p.type === 'text') parts.push({ text: p.text });
            else if (p.type === 'image_url') {
              const match = p.image_url.url.match(/^data:(image\/(\w+));base64,(.+)$/);
              if (match) parts.push({ inlineData: { mimeType: match[1], data: match[3] } });
            }
            else if (p.type === 'file') parts.push({ text: `[${t('file_attachment')}: ${p.name} (${formatSize(p.size)}) base64: ${p.data}]` });
          });
          return parts.length ? parts : [{ text: '' }];
        }
        return [{ text: String(m.content ?? '') }];
      };
      const merged = [];
      messages.forEach(m => {
        const role = m.role === 'assistant' ? 'model' : 'user';
        const parts = partsFor(m);
        const last = merged[merged.length - 1];
        if (last && last.role === role) last.parts.push(...parts);
        else merged.push({ role, parts });
      });
      requestBody = {
        contents: merged,
        generationConfig: {
          temperature: data.temperature,
          maxOutputTokens: data.max_tokens,
          topP: data.top_p,
        }
      };
      if (systemText) requestBody.systemInstruction = { parts: [{ text: systemText }] };
    } else {
      const finalMessages = messages.map(m => {
        if (typeof m.content !== 'string' && Array.isArray(m.content)) {
          const parts = [];
          m.content.forEach(p => {
            if (p.type === 'text') parts.push({ type: 'text', text: p.text });
            else if (p.type === 'image_url') parts.push({ type: 'image_url', image_url: { url: p.image_url.url } });
            else if (p.type === 'file') parts.push({ type: 'text', text: `[${t('file_attachment')}: ${p.name} (${formatSize(p.size)})]` });
          });
          m.content.forEach(p => {
            if (p.type === 'file') parts.push({ type: 'text', text: `--- ${p.name} (base64) ---\n${p.data}` });
          });
          return { role: m.role, content: parts };
        }
        return m;
      });
      requestBody = {
        model: data.model,
        messages: finalMessages,
        temperature: data.temperature,
        max_tokens: data.max_tokens,
        top_p: data.top_p,
        frequency_penalty: data.frequency_penalty
      };
    }

    const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${data.api_key}` };
    if (claude) { headers['anthropic-version'] = '2023-06-01'; headers['x-api-key'] = data.api_key; }
    else if (google) { delete headers['Authorization']; }

    const startTime2 = performance.now();
    const response = await fetch(apiUrl, { method: 'POST', headers, body: JSON.stringify(requestBody) });
    const elapsed = performance.now() - startTime2;

    if (!response.ok) {
      const errorData = await response.json().catch(() => ({ error: { message: response.statusText } }));
      throw new Error(`API ${response.status}: ${errorData?.error?.message || response.statusText}`);
    }

    const respData = await response.json();
    let content;

    if (claude || isMessagesEndpoint) {
      if (respData.content && respData.content.length > 0) {
        content = respData.content.filter(c => c.type === 'text').map(c => c.text).join('');
      } else {
        throw new Error('Invalid response: missing content');
      }
    } else if (google) {
      if (respData.candidates && respData.candidates.length > 0) {
        content = (respData.candidates[0].content?.parts || [])
          .filter(p => p.text).map(p => p.text).join('') || '(empty)';
      } else {
        throw new Error('Invalid response: missing candidates');
      }
    } else {
      if (respData.choices && respData.choices.length > 0) {
        content = respData.choices[0].message?.content || '(empty)';
      } else if (respData.content && Array.isArray(respData.content)) {
        content = respData.content.filter(c => c.type === 'text').map(c => c.text).join('') || '(empty)';
      } else {
        throw new Error('Invalid response: missing choices');
      }
    }

    const meta = {
      duration_ms: elapsed,
      tokens: respData.usage?.total_tokens || respData.usage?.output_tokens || null,
      model_name: respData.model || data.model
    };

    // 保存当前模型配置到对话，下次打开时自动恢复
    await api(`api/conversations/${currentConvId}`, {
      method: 'PUT',
      body: JSON.stringify({ last_config: JSON.stringify(data) })
    });

    await api('api/messages', {
      method: 'POST',
      body: JSON.stringify({
        conversation_id: currentConvId,
        role: 'assistant',
        content: content,
        duration_ms: meta.duration_ms,
        tokens: meta.tokens,
        model_name: meta.model_name
      })
    });

    renderMessage({ role: 'assistant', content, ...meta });
    scrollToBottom();

    if (inputText && inputText.length <= 30) {
      const convs = await api('api/conversations');
      const conv = convs.find(c => c.id === currentConvId);
      if (conv && (conv.title === t('new_conversation_title') || conv.title === '新对话' || conv.title === 'New Chat')) {
        await api(`api/conversations/${currentConvId}`, {
          method: 'PUT',
          body: JSON.stringify({ title: inputText.substring(0, 30) })
        });
        document.getElementById('currentConvTitle').textContent = inputText.substring(0, 30);
        await loadConversations();
      }
    } else {
      await loadConversations();
    }

  } catch (error) {
    const elapsed = performance.now() - startTime;
    const errContent = `${t('request_failed')}: ${error.message}`;
    await api('api/messages', {
      method: 'POST',
      body: JSON.stringify({
        conversation_id: currentConvId,
        role: 'assistant',
        content: errContent,
        is_error: true,
        duration_ms: elapsed
      })
    });
    renderMessage({ role: 'assistant', content: errContent, is_error: true, duration_ms: elapsed });
    scrollToBottom();
  } finally {
    document.getElementById('spinner').classList.add('hidden');
    document.getElementById('sendBtn').disabled = false;
    const sp = document.getElementById('spinnerText');
    delete sp.dataset.manual;
    document.getElementById('input').focus();
  }
}

// ============================================================
// UI 工具函数
// ============================================================
function toggleLeftDrawer() {
  document.getElementById('leftDrawer').classList.toggle('collapsed');
}

function toggleRightDrawer() {
  document.getElementById('rightDrawer').classList.toggle('collapsed');
}

function toggleAdvanced(e) {
  e.stopPropagation();
  const panel = document.getElementById('advPanel');
  const chevron = document.getElementById('advChevron');
  panel.classList.toggle('hidden');
  chevron.classList.toggle('rotate-180');
}

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
}

function formatDuration(ms) {
  if (ms < 1000) return `${Math.round(ms)}ms`;
  return `${(ms / 1000).toFixed(2)}s`;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function tryGetHost(url) {
  try { return new URL(url).host; } catch(e) { return url; }
}

// ============================================================
// 图片查看器（Viewer.js）
// ============================================================
let chatViewer = null;
function initViewer() {
  const el = document.getElementById('chatHistory');
  chatViewer = new Viewer(el, {
    trigger: 'dblclick',
    toolbar: {
      zoomIn: true,
      zoomOut: true,
      oneToOne: true,
      reset: true,
      rotateLeft: true,
      rotateRight: true,
      flipHorizontal: true,
      flipVertical: true,
      prev: false,
      next: false,
      play: false,
      download: true,
    },
    title: false,
    tooltip: false,
   _transition: false,
  });
}

// ============================================================
// 启动
// ============================================================
applyTheme(currentTheme);
document.documentElement.lang = currentLang === 'zh' ? 'zh' : 'en';
applyI18n();
initViewer();
init();
</script>
</body>
