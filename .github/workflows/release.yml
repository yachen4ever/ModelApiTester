name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ────────────────── Rust 后端二进制 ──────────────────
  build-server:
    name: Build server (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: model-api-tester-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: model-api-tester-windows-x64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: model-api-tester-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: model-api-tester-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build (debug, unstripped)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          BIN="model-api-tester"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then BIN="$BIN.exe"; fi
          cp "target/${{ matrix.target }}/release/$BIN" "$BIN"
          mv "$BIN" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ────────────────── Vite 前端打包 ──────────────────
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Zip frontend
        working-directory: frontend
        run: zip -r frontend-dist.zip dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ────────────────── 发布 Release ──────────────────
  release:
    name: Create Release
    needs: [build-server, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Zip frontend
        working-directory: artifacts
        run: zip -r frontend-dist.zip frontend-dist/

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/model-api-tester-linux-x64
            artifacts/model-api-tester-windows-x64.exe
            artifacts/model-api-tester-macos-arm64
            artifacts/model-api-tester-macos-x64
            artifacts/frontend-dist.zip
