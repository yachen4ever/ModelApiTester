name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ────────────────── Rust 后端二进制 ──────────────────
  # 服务器版仅发布 Linux（x64 + arm64），精简产物
  build-server:
    name: Build server (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mat-server-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: mat-server-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }} -p mat-http-server

      - name: Rename binary
        shell: bash
        run: |
          BIN="model-api-tester"
          cp "target/${{ matrix.target }}/release/$BIN" "$BIN"
          mv "$BIN" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ────────────────── Vite 前端打包 ──────────────────
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Zip frontend
        run: cd crates/http-server/static && zip -r ../../../mat-frontend-dist.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mat-frontend-dist
          path: mat-frontend-dist.zip

  # ────────────────── Tauri 桌面应用 ──────────────────
  # Windows amd64 单文件 / Linux amd64 (deb + AppImage) / macOS silicon + intel (dmg)
  build-tauri:
    name: Build Tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            label: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            label: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: none
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for Tauri
        working-directory: frontend
        env:
          TAURI_ENV_PLATFORM: desktop
        run: npm run build

      - name: Build Tauri app
        working-directory: crates/tauri-app
        shell: bash
        run: |
          if [[ "${{ matrix.bundles }}" == "none" ]]; then
            npx @tauri-apps/cli build --target ${{ matrix.target }} --no-bundle
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            npx @tauri-apps/cli build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --no-sign
          else
            npx @tauri-apps/cli build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          fi

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p tauri-bin
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/mat-tauri-app.exe" "tauri-bin/mat-desktop-windows-x64.exe"
          else
            cp "target/${{ matrix.target }}"/release/bundle/appimage/*.AppImage tauri-bin/ 2>/dev/null || true
            cp "target/${{ matrix.target }}"/release/bundle/deb/*.deb tauri-bin/ 2>/dev/null || true
            cp "target/${{ matrix.target }}"/release/bundle/dmg/*.dmg tauri-bin/ 2>/dev/null || true
          fi
          ls -lh tauri-bin/

      - name: Upload Tauri bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bin-${{ matrix.label }}
          path: tauri-bin/*

  # ────────────────── 发布 Release ──────────────────
  release:
    name: Create Release
    needs: [build-server, build-frontend, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
