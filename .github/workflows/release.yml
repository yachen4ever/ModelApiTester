name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Linux binary
        run: bun build src/server.ts --compile --target=bun-linux-x64 --outfile model-api-tester-linux

      - name: Build Windows binary
        run: bun build src/server.ts --compile --target=bun-windows-x64 --outfile model-api-tester-windows.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            model-api-tester-linux
            model-api-tester-windows.exe
