name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ────────────────── Rust 后端二进制 ──────────────────
  build-server:
    name: Build server (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mat-server-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mat-server-windows-x64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: mat-server-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: mat-server-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }} -p mat-http-server

      - name: Rename binary
        shell: bash
        run: |
          BIN="model-api-tester"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then BIN="$BIN.exe"; fi
          cp "target/${{ matrix.target }}/release/$BIN" "$BIN"
          mv "$BIN" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ────────────────── Vite 前端打包 ──────────────────
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Zip frontend
        run: cd crates/http-server/static && zip -r ../../../mat-frontend-dist.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mat-frontend-dist
          path: mat-frontend-dist.zip

  # ────────────────── Tauri 桌面应用 ──────────────────
  build-tauri:
    name: Build Tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mat-desktop-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mat-desktop-windows-x64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: mat-desktop-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for Tauri
        working-directory: frontend
        env:
          TAURI_ENV_PLATFORM: desktop
        run: npm run build

      - name: Build Tauri app
        working-directory: crates/tauri-app
        run: npx @tauri-apps/cli build --target ${{ matrix.target }} --no-bundle

      - name: Collect binary
        shell: bash
        run: |
          mkdir -p tauri-bin
          BIN="mat-tauri-app"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then BIN="$BIN.exe"; fi
          cp "target/${{ matrix.target }}/release/$BIN" "tauri-bin/${{ matrix.artifact }}"
          ls -lh tauri-bin/

      - name: Upload Tauri binary
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bin-${{ matrix.os }}
          path: tauri-bin/*

  # ────────────────── 发布 Release ──────────────────
  release:
    name: Create Release
    needs: [build-server, build-frontend, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
